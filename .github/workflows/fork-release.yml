name: Fork release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: env -u TMUX bun test src/server/pikkumies/guard.test.ts src/server/pikkumies/invariants.test.ts
      - run: bun build src/server/index.ts src/server/sessionRefreshWorker.ts src/server/logMatchWorker.ts src/server/devinSyncWorker.ts src/server/stallWatchdogWorker.ts src/server/sessionReadWorker.ts src/server/sessionMetadataWorker.ts --compile --target bun-linux-x64 --outfile agentboard-linux-x64
      - name: Package binary and frontend
        run: |
          tar -czf agentboard-linux-x64-frontend.tar.gz dist/client
          sha256sum agentboard-linux-x64 > agentboard-linux-x64.sha256
          sha256sum agentboard-linux-x64-frontend.tar.gz > agentboard-linux-x64-frontend.tar.gz.sha256
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" agentboard-linux-x64 agentboard-linux-x64.sha256 agentboard-linux-x64-frontend.tar.gz agentboard-linux-x64-frontend.tar.gz.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" agentboard-linux-x64 agentboard-linux-x64.sha256 agentboard-linux-x64-frontend.tar.gz agentboard-linux-x64-frontend.tar.gz.sha256 --generate-notes
          fi

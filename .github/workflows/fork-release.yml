name: Fork release

on:
  push:
    tags:
      # Fork releases only: upstream tags (vX.Y.Z) fetched into this repo must not build or publish.
      - 'v*-pikkumies.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y tmux qemu-user
      - run: bun x playwright install --with-deps chromium
      - run: bun run lint
      - run: bun run typecheck
      - run: env -u TMUX bun run test:ci
      - run: bun run build
      - run: bun build src/server/index.ts src/server/sessionRefreshWorker.ts src/server/logMatchWorker.ts src/server/devinSyncWorker.ts src/server/stallWatchdogWorker.ts src/server/sessionReadWorker.ts src/server/sessionMetadataWorker.ts --compile --target bun-linux-x64-baseline --define AGENTBOARD_RELEASE_BUILD=true --outfile agentboard-linux-x64
      - run: |
          out=$(env -i PATH="$PATH" HOME="$HOME" NODE_ENV=test AGENTBOARD_TEST_TCP=1 AGENTBOARD_TEST_AUTH_BYPASS=1 timeout 10 ./agentboard-linux-x64 2>&1 || true)
          echo "$out" | grep -q "AGENTBOARD_SOCKET is required"
      - run: qemu-x86_64 -cpu Nehalem ./agentboard-linux-x64 --version
      - run: sha256sum agentboard-linux-x64 > agentboard-linux-x64.sha256
      - run: env -u TMUX AGENTBOARD_E2E_BINARY="$PWD/agentboard-linux-x64" bun x playwright test --config src/server/pikkumies/playwright.config.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-agentboard-linux-x64
          path: |
            agentboard-linux-x64
            agentboard-linux-x64.sha256
            dist/client/**

  linux-x64:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verified-agentboard-linux-x64
      - run: sha256sum --check agentboard-linux-x64.sha256
      - name: Package binary and frontend
        run: |
          tar -czf agentboard-linux-x64-frontend.tar.gz dist/client
          sha256sum agentboard-linux-x64-frontend.tar.gz > agentboard-linux-x64-frontend.tar.gz.sha256
          # One archive with the binary as `agentboard` and its frontend beside it, the layout installers use.
          mkdir -p pkg
          install -m 0755 agentboard-linux-x64 pkg/agentboard
          cp -R dist pkg/dist
          tar -czf agentboard-linux-x64-baseline.tar.gz --owner=0 --group=0 --numeric-owner -C pkg agentboard dist/client
          sha256sum agentboard-linux-x64-baseline.tar.gz > agentboard-linux-x64-baseline.tar.gz.sha256
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" agentboard-linux-x64 agentboard-linux-x64.sha256 agentboard-linux-x64-frontend.tar.gz agentboard-linux-x64-frontend.tar.gz.sha256 agentboard-linux-x64-baseline.tar.gz agentboard-linux-x64-baseline.tar.gz.sha256
          else
            gh release create "$GITHUB_REF_NAME" agentboard-linux-x64 agentboard-linux-x64.sha256 agentboard-linux-x64-frontend.tar.gz agentboard-linux-x64-frontend.tar.gz.sha256 agentboard-linux-x64-baseline.tar.gz agentboard-linux-x64-baseline.tar.gz.sha256 --generate-notes
          fi
